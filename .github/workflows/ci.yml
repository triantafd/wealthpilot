name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The button that stands in for a nightly cron. A schedule would bill a few
  # cents a day to detect drift nobody had asked about, in a report nobody
  # opens; see docs/NOTES.md. This runs the full suite when you ask for it.
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [all, rag, smoke]
        default: all

# A new push to the same branch makes the previous run irrelevant. Without
# this, a busy branch queues runs that are already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The same image as docker-compose.yml. Postgres alone would fail the
      # first migration, which enables the vector extension.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        # Steps start as soon as the container is reported healthy, so this
        # check is what prevents a race with the first migration.
        options: >-
          --health-cmd "pg_isready -U wealthpilot -d wealthpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      # app/config.py composes the DSN from these. No .env exists in CI, so
      # anything not set here falls through to the defaults in Settings.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
      # The read-only role that executes generated SQL. Migration ffa5261360c4
      # creates it and fails if these are unset, so CI has to supply them; the
      # role exists only inside this throwaway service container.
      POSTGRES_RO_USER: wealthpilot_ro
      POSTGRES_RO_PASSWORD: wealthpilot_ro

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version: unlike actions/checkout and
        # pnpm/action-setup, setup-uv publishes no floating major tag, so
        # "@v10" does not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # Invalidate the cache when the lockfile changes, not on every run.
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock disagrees with pyproject.toml, so a
        # lockfile someone forgot to commit breaks CI rather than resolving
        # to different versions than they tested against.
        run: uv sync --frozen

      - name: Lint
        # ../evals too: the eval CLI lives outside backend/ because that is
        # the path CLAUDE.md documents, but it is still our code.
        run: uv run ruff check . ../evals

      - name: Check formatting
        run: uv run ruff format --check . ../evals

      - name: Type check
        run: uv run mypy app

      - name: Run migrations
        # Before pytest: the schema tests assert against real tables, and the
        # migrations themselves are under test here — a broken revision fails
        # the build at this step rather than as a confusing test error.
        run: uv run alembic upgrade head

      - name: Verify the schema matches the models
        # Catches a model change committed without its migration, which would
        # otherwise only surface when someone next ran autogenerate.
        run: uv run alembic check

      - name: Test
        # CI=true makes the database fixtures fail instead of skip, so a
        # misconfigured service container cannot pass as a green build.
        run: uv run pytest -q

      - name: Verify the seed script runs end to end
        # The seed is the input to every eval, so "it imports" is not enough.
        # --reset makes the step idempotent: without it the script exits
        # non-zero when data already exists, which would make this step depend
        # on whether an earlier step happened to populate the database.
        run: uv run python -m app.scripts.seed --reset

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Browser
    runs-on: ubuntu-latest

    # Unlike the eval gate this costs nothing: the model and the embedder are
    # faked, so there is no API key and no bill, and it runs on every pull
    # request like the other two.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot -d wealthpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      # The launcher appends `_e2e` and builds that database itself, so this
      # names the one it is a sibling of rather than the one it uses.
      POSTGRES_DB: wealthpilot
      # Migration ffa5261360c4 creates the read-only role and fails without
      # them, and the launcher runs every migration.
      POSTGRES_RO_USER: wealthpilot_ro
      POSTGRES_RO_PASSWORD: wealthpilot_ro

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, because the browser build a given
          # @playwright/test expects is pinned to its version — a cache hit
          # against a different one is a browser Playwright refuses to drive.
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install the browser
        working-directory: frontend
        # `--with-deps` because a bare runner has none of the shared libraries
        # Chromium links against. No-op when the cache hit.
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        working-directory: frontend
        run: pnpm test:e2e

      - name: Keep the report
        # On failure only: a trace and a video of a passing run is 20MB of
        # artifact nobody opens.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  evals:
    name: Evals
    runs-on: ubuntu-latest

    # Three conditions, each for its own reason.
    #
    # Not on push to main: the merge commit's content was measured on the pull
    # request minutes earlier, so a second run is a second bill for an answer
    # we already have.
    #
    # Not on a fork's pull request: secrets are not available there, so the job
    # could only fail for a reason the contributor cannot fix.
    #
    # The manual run is always allowed, whatever it was dispatched from.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthpilot -d wealthpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
      POSTGRES_RO_USER: wealthpilot_ro
      POSTGRES_RO_PASSWORD: wealthpilot_ro
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # `inputs` is empty outside a manual run, and an empty string is falsy in
      # a GitHub expression, so a pull request gets the smoke suite.
      SUITE: ${{ inputs.suite || 'smoke' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Check the API key is configured
        # Fails rather than skips. A gate that quietly does not run is the
        # failure mode this phase exists to prevent, and unlike a fork's
        # missing secret this one is fixable by whoever owns the repository.
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set. Add it under Settings →" \
                 "Secrets and variables → Actions, or the eval gate cannot run."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # The judge is off for smoke and on for the other suites, and ragas is
        # not a runtime dependency, so a pull request does not install pandas,
        # pyarrow and huggingface-hub to answer 27 questions.
        run: |
          if [ "$SUITE" = smoke ]; then
            uv sync --frozen
          else
            uv sync --frozen --group evals
          fi

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Seed
        run: uv run python -m app.scripts.seed

      - name: Index the corpus
        # From an empty database every time, which is the point: the floors in
        # evals/thresholds.yaml were measured against one developer's local
        # index, and a run here is what says whether they reproduce.
        run: uv run python -m app.scripts.ingest

      - name: Run the suite
        # From the repository root, the path CLAUDE.md documents. The gate is
        # on by default inside the CLI, so this step's exit code is the gate's
        # verdict — there is no threshold logic in this file to drift from it.
        working-directory: ${{ github.workspace }}
        run: uv run --project backend python evals/run.py --suite "$SUITE"

      - name: Keep the report
        # Reports are gitignored, so without this the numbers die with the
        # runner. `always()` because a failed gate is exactly when you want to
        # read the report.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ env.SUITE }}-${{ github.run_id }}
          # baseline.json lives in the same directory and is committed; an
          # artifact containing it would invite reading last month's numbers as
          # this run's.
          path: |
            evals/reports/*.json
            !evals/reports/baseline.json
          # A warning, not an error: if the suite died before writing a report
          # the run has already failed for the real reason, and a second red
          # step here would only compete with it for attention.
          if-no-files-found: warn
