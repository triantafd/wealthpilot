[project]
name = "wealthpilot"
version = "0.1.0"
description = "Multi-agent AI assistant for a synthetic wealth-management firm"
# Upper bound on purpose: ruff and mypy below target 3.12, and the Phase 3
# reranker pulls torch, which lags new interpreter releases on wheel support.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deliberately not fastapi[standard]: it pulls sentry-sdk, fastapi-cloud-cli
    # and typer transitively, which this service does not use.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy[asyncio]>=2.0",
    "pyyaml>=6.0",
    "openai>=1.60",
    "langchain-text-splitters>=0.3",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    # Runtime, unlike ragas below: the service traces itself in production.
    # v4 renamed the span API (start_as_current_observation) and the client
    # argument is base_url, so the major is pinned rather than floating.
    "langfuse>=4,<5",
]

# `app` is installed into the venv rather than merely being on sys.path, so
# `uv run --project backend python evals/run.py` can import it from the repo
# root (see the evals commands in CLAUDE.md).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
# Kept out of the runtime dependencies on purpose: the service never scores
# itself, and ragas pulls pandas, pyarrow and huggingface-hub, which would be
# dead weight in the Phase 9 image.
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]
evals = [
    # ragas 0.3.1 imports langchain_community.chat_models.vertexai, removed in
    # community 0.4, and imports PIL without declaring pillow. Both of these are
    # workarounds for ragas's own dependency set, not choices. Neither reaches
    # the runtime dependencies above.
    "langchain-community<0.4",
    "pillow>=12.3.0",
    "ragas>=0.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ANN",    # type annotations — "type hints everywhere" in CLAUDE.md
    "ASYNC",  # async correctness
    "S",      # bandit security rules
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may hardcode throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]

[[tool.mypy.overrides]]
# ragas ships no py.typed marker. Only the eval harness imports it, and it is
# imported lazily there, so the untyped surface is small and contained.
module = ["ragas.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# LLM tests cost money, so they are opt-in: `uv run pytest -m llm`.
addopts = "-m 'not llm'"
markers = [
    "llm: hits a real LLM provider; excluded from the default run",
]
